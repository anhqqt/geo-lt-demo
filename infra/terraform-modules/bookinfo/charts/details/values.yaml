# Default values for this chart. Override only the settings needed by the deployment.
replicaCount: 1
revisionHistoryLimit: 2
progressDeadlineSeconds: 600
deploymentStrategy:
  type: Recreate
imagePullPolicy: IfNotPresent
containerPort: 9080
service:
  port: 9080
nodeSelector:
  workload: main
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 36
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1
image: registry.istio.io/release/examples-bookinfo-details-v1:1.20.3@sha256:a49731e1fc05d7c24a4103709f41d64180bed989b251625f4c31ba63022e303b
environment:
  ENABLE_EXTERNAL_BOOK_SERVICE: "false"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu:
    memory: 128Mi
