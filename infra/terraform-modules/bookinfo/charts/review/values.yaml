# Default values for this chart. Override only the settings needed by the deployment.
replicaCount: 1
revisionHistoryLimit: 2
progressDeadlineSeconds: 600
deploymentStrategy:
  type: Recreate
imagePullPolicy: IfNotPresent
containerPort: 9080
service:
  port: 9080
nodeSelector:
  workload: main
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 36
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1
image: registry.istio.io/release/examples-bookinfo-reviews-v2:1.20.3@sha256:09b92ca16738b5bded2ae66ba0a4b21d32e86d8b6ddb34331abfe1179d8c6298
environment:
  RATINGS_HOSTNAME: ratings
  RATINGS_SERVICE_PORT: "9080"
  ENABLE_RATINGS: "true"
  STAR_COLOR: black
  LOG_DIR: /tmp/logs
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu:
    memory: 512Mi
