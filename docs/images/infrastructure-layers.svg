<text x="48" y="58" font-size="30" font-weight="600" fill="#111827" text-anchor="start">Infrastructure layers</text>
<text x="48" y="93" font-size="18" font-weight="400" fill="#526174" text-anchor="start">Account-wide resources and regional infrastructure are grouped by responsibility.</text>
