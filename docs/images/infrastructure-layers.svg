<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 910" width="1280" height="910" role="img" aria-labelledby="title desc">
<title id="title">Infrastructure layers</title><desc id="desc">One AWS Dev account contains the Global layer with identity and DNS. The Singapore region contains Core with VPC and ACM, and Platform with cluster, bootstrap and Bookinfo. Each resource card is a Terragrunt unit with its own state; the four Bookinfo services share one unit and state.</desc>
<style>text {font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;}</style>
<defs>
<marker id="data" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
