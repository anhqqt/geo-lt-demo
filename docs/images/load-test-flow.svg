<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 688" width="1280" height="688" role="img" aria-labelledby="load-test-flow-title load-test-flow-desc">
<title id="load-test-flow-title">How a load test runs</title><desc id="load-test-flow-desc">The developer chooses a target and load. GitHub Actions checks the request, then k6 tests Bookinfo. Results are available during and after the run. GitHub Actions removes only this run&#x27;s k6 resources when the run ends. Reading results does not trigger cleanup.</desc>
<style>text {font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker></defs>
<rect width="1280" height="688" fill="#ffffff"/>
<text x="48" y="58" font-size="30" font-weight="600" fill="#111827" text-anchor="start">How a load test runs</text>
<text x="48" y="93" font-size="18" font-weight="400" fill="#526174" text-anchor="start">Choose the load, run the test, and read the results.</text>
<rect x="1032" y="30" width="200" height="36" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="1132" y="54" font-size="15" font-weight="600" fill="#9a3412" text-anchor="middle">Load-test workflow</text>
<path d="M48 119 H1232" stroke="#e5e7eb" stroke-width="1"/>
<rect x="48" y="170" width="304" height="152" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="68" y="198" font-size="14" font-weight="600" fill="#526174" text-anchor="start">DEVELOPER</text>
<text x="68" y="231" font-size="22" font-weight="600" fill="#111827" text-anchor="start">Choose the load</text>
<text x="68" y="260" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Target, users, duration,</text>
<text x="68" y="284" font-size="17" font-weight="400" fill="#526174" text-anchor="start">and runner count</text>
<rect x="464" y="170" width="304" height="152" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="484" y="198" font-size="14" font-weight="600" fill="#526174" text-anchor="start">GITHUB ACTIONS</text>
<text x="484" y="231" font-size="22" font-weight="600" fill="#111827" text-anchor="start">Check inputs</text>
<text x="484" y="260" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Validate the request</text>
<text x="484" y="284" font-size="17" font-weight="400" fill="#526174" text-anchor="start">and load limits</text>
<rect x="880" y="170" width="352" height="152" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.6"/>
<text x="900" y="198" font-size="14" font-weight="600" fill="#526174" text-anchor="start">K6 ON EKS</text>
<text x="900" y="231" font-size="22" font-weight="600" fill="#111827" text-anchor="start">Run the test</text>
<text x="900" y="260" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Send load to prepared</text>
<text x="900" y="284" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Bookinfo services</text>
<path d="M352 246 H464" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M768 246 H880" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1056 322 V440" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1058.0" y="367" width="154" height="27" rx="4" fill="#ffffff" fill-opacity="0.97"/>
<text x="1135" y="386" font-size="16" font-weight="400" fill="#526174" text-anchor="middle">Live + after run</text>
<path d="M1056 322 V368 H616 V440" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="716.0" y="350" width="170" height="27" rx="4" fill="#ffffff" fill-opacity="0.97"/>
<text x="801" y="369" font-size="16" font-weight="400" fill="#526174" text-anchor="middle">When the run ends</text>
<rect x="880" y="440" width="352" height="140" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="900" y="468" font-size="14" font-weight="600" fill="#526174" text-anchor="start">DEVELOPER</text>
<text x="900" y="501" font-size="22" font-weight="600" fill="#111827" text-anchor="start">View results</text>
<text x="900" y="530" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Run summary + Grafana</text>
<text x="900" y="554" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Live and saved metrics</text>
<rect x="464" y="440" width="304" height="140" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="484" y="468" font-size="14" font-weight="600" fill="#526174" text-anchor="start">GITHUB ACTIONS</text>
<text x="484" y="501" font-size="22" font-weight="600" fill="#111827" text-anchor="start">Clean up</text>
<text x="484" y="530" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Remove this run&#x27;s k6 objects</text>
<text x="484" y="554" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Report cleanup status</text>
<text x="48" y="478" font-size="22" font-weight="600" fill="#111827" text-anchor="start">Shared services stay.</text>
<text x="48" y="511" font-size="17" font-weight="400" fill="#526174" text-anchor="start">Bookinfo, EKS and monitoring</text>
<text x="48" y="537" font-size="17" font-weight="400" fill="#526174" text-anchor="start">remain available after each run.</text>
<path d="M48 618 H1232" stroke="#e5e7eb" stroke-width="1"/>
<text x="48" y="655" font-size="18" font-weight="400" fill="#526174" text-anchor="start">Terragrunt and Terraform manage the shared platform.</text>
</svg>
