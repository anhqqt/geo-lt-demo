<!doctype html><html lang="en"><head><meta charset="utf-8"><title>foundation-teardown</title><style>body{margin:24px;background:white}svg{display:block;max-width:276px}</style></head><body><svg id="diagram-foundation-teardown" xmlns="http://www.w3.org/2000/svg" width="276" height="1414" viewBox="0 0 276 1414" role="img" aria-labelledby="foundation-teardown-title foundation-teardown-desc"><title id="foundation-teardown-title">foundation teardown</title><desc id="foundation-teardown-desc">Final teardown keeps the shared ALB for Grafana after Bookinfo removal, removes the last Ingress and ALB listeners before ACM, preserves controller dependencies, and removes parent delegation, the child hosted zone, and backend in order.</desc><defs><marker id="foundation-teardown-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#333"/></marker></defs><path d="M138 110 V155" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 262 V307" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 438 V483" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 566 V611" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 718 V763" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 870 V915" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 974 V1019" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 1150 V1195" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><path d="M138 1278 V1323" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#foundation-teardown-arrow)"/><rect x="8" y="8" width="260" height="102" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="40" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Export required evidence</tspan><tspan x="138" dy="24">and recovery material</tspan><tspan x="138" dy="24">outside the foundation</tspan></text><rect x="8" y="160" width="260" height="102" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="192" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Remove Bookinfo Ingress</tspan><tspan x="138" dy="24">and endpoint DNS</tspan><tspan x="138" dy="24">Keep shared ALB for Grafana</tspan></text><rect x="8" y="312" width="260" height="126" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="344" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Remove final Grafana Ingress</tspan><tspan x="138" dy="24">and endpoint DNS; confirm</tspan><tspan x="138" dy="24">ALB and listeners are gone</tspan><tspan x="138" dy="24">while LBC and EKS remain</tspan></text><rect x="8" y="488" width="260" height="78" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="520" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Delete unused ACM certificate</tspan><tspan x="138" dy="24">and its DNS validation records</tspan></text><rect x="8" y="616" width="260" height="102" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="648" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Reconcile monitoring data</tspan><tspan x="138" dy="24">and volumes while the</tspan><tspan x="138" dy="24">storage controller remains</tspan></text><rect x="8" y="768" width="260" height="102" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="800" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Release platform resources</tspan><tspan x="138" dy="24">before their controllers</tspan><tspan x="138" dy="24">and identities</tspan></text><rect x="8" y="920" width="260" height="54" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="952" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Remove cluster and node groups</tspan></text><rect x="8" y="1024" width="260" height="126" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="1056" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">After consumers finish:</tspan><tspan x="138" dy="24">remove parent NS, then empty</tspan><tspan x="138" dy="24">child zone and remaining</tspan><tspan x="138" dy="24">foundation resources</tspan></text><rect x="8" y="1200" width="260" height="78" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="1232" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Reconcile inventory and</tspan><tspan x="138" dy="24">retain final teardown evidence</tspan></text><rect x="8" y="1328" width="260" height="78" fill="#ECECFF" stroke="#9370DB"/><text x="138" y="1360" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="16" fill="#333"><tspan x="138" dy="0">Remove backend separately,</tspan><tspan x="138" dy="24">including versioned objects</tspan></text></svg></body></html>
